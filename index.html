<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title id="appTitle">Kniffel Dual</title><style>
body{
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  margin:0;padding:0;text-align:center;
  overflow-x:hidden;
}
h2{
  margin:8px 0 2px;
  color:#ffcc66;
  text-shadow:0 0 6px #ffb400;
  letter-spacing:0.5px;
}
#gameInfo{
  font-size:13px;color:#0f0;margin-bottom:5px;
}
#controls{
  margin-top:8px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:4px;
  border-top:1px solid #333;padding-top:8px;
}
button{
  background:#222;
  color:#fff;
  border:1px solid #555;
  border-radius:6px;
  padding:8px 16px;
  margin:2px;
  font-size:15px;
  transition:all .15s ease;
}
button:hover{background:#444;cursor:pointer;}
table{
  border-collapse:collapse;
  width:98%;
  margin:auto;
  border:1px solid #333;
}
th,td{
  border:1px solid #333;
  text-align:center;
  padding:6px 4px;
}
th{
  background:#1a1a1a;
  border-bottom:2px solid #444;
}
tbody tr:nth-child(odd) td{background:#181818;}
tbody tr:nth-child(even) td{background:#151515;}
tr:nth-child(1),tr:nth-child(2),tr:nth-child(3),
tr:nth-child(4),tr:nth-child(5),tr:nth-child(6),
tr:nth-child(7),tr:nth-child(8){
  background-color:#1b1b1b;
}
tr:nth-child(9),tr:nth-child(10),tr:nth-child(11),
tr:nth-child(12),tr:nth-child(13),tr:nth-child(14),
tr:nth-child(15),tr:nth-child(16),tr:nth-child(17){
  background-color:#111;
}
.sumRow td{
  background:#222!important;
  font-weight:bold;
  color:#fff;
  border-top:1px solid #555;
}
td.filled{background:#444;color:#ff0;}
td:hover{background:#2a2a2a;cursor:pointer;}
td.active{
  background:#2f2f1a!important;
  box-shadow:0 0 6px #ffb400 inset;
}
.section-title{text-align:left;font-weight:bold;padding-left:4px;}
/* Kompaktansicht v36: Hinweise direkt neben dem Namen statt am rechten Rand. */
#scoreTable{table-layout:fixed;width:98%;}
#scoreTable th,#scoreTable td{padding:3px 3px;height:27px;box-sizing:border-box;}
#scoreTable th:first-child,#scoreTable td.section-title{width:29%;}
#scoreTable td.section-title{padding:2px 5px;}
.section-title .cat-line{display:flex;align-items:center;justify-content:flex-start;gap:7px;min-width:0;}
.section-title .cat-name{font-weight:bold;font-size:clamp(11px,1.35vw,15px);line-height:1.12;min-width:0;}
.section-title .cat-rule{font-size:clamp(10px,1.15vw,13px);font-weight:normal;line-height:1.1;white-space:nowrap;color:#cbd0d1;flex-shrink:0;}
.score-top .section-title .cat-rule{color:#b6dce8;}
.score-bottom .section-title .cat-rule{color:#ead3a7;}
.section-title .cat-dice{font-size:clamp(16px,1.8vw,22px);letter-spacing:1px;line-height:1;white-space:nowrap;}
#scoreTable .sumRow td{height:30px;}
/* Sieben und acht Spieler: Kategorie bleibt lesbar, Spielerfelder teilen Restbreite. */
#scoreTable.manyPlayers th:first-child,#scoreTable.manyPlayers td.section-title{width:29%;}
#scoreTable.manyPlayers .nameInput{width:100%;min-width:0;box-sizing:border-box;font-size:clamp(9px,1.25vw,13px);}
#scoreTable.manyPlayers .playerHead{padding:2px 0;gap:2px;}
#scoreTable.manyPlayers th,#scoreTable.manyPlayers td{padding-left:1px;padding-right:1px;}
#scoreTable.manyPlayers .turnCounter{font-size:10px;}
@media(max-width:650px){#scoreTable.manyPlayers th:first-child,#scoreTable.manyPlayers td.section-title{width:34%;}#scoreTable th:first-child,#scoreTable td.section-title{width:34%;}#scoreTable .section-title .cat-name{font-size:11px;}#scoreTable .section-title .cat-rule{font-size:9px;}#scoreTable th,#scoreTable td{padding:2px;}#scoreTable td.section-title{padding:2px 3px;}}

.playerHead{
  display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:3px 2px;
}
input.nameInput{
  width:95%;background:#222;color:#fff;border:none;
  text-align:center;border-bottom:1px solid #555;font-weight:bold;
}
.turnCounter{font-size:11px;color:#aaa;}
.turnCounter.done{color:#0f0;font-weight:bold;}
.activePlayer{background:#ffb400!important;color:#000;}
#contextMenu{
  position:fixed;background:rgba(20,20,20,0.97);
  border:1px solid #555;display:none;z-index:1000;
  border-radius:10px;box-shadow:0 0 15px #000;
  max-height:70vh;overflow-y:auto;width:72vw;max-width:220px;
}
#contextMenu button{
  display:block;width:100%;color:#fff;background:none;
  border:none;text-align:center;font-size:18px;font-weight:bold;
  padding:8px 0;transition:.1s;
}
#contextMenu button:hover{background:#ffb400;color:#000;}
#contextMenu button.deleteBtn{
  color:#f33;font-size:17px;border-top:1px solid #666;
}
#contextMenu::-webkit-scrollbar{width:5px;}
#contextMenu::-webkit-scrollbar-thumb{background:#555;border-radius:5px;}
#kniffelShow,#winnerOverlay,#warnOverlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;z-index:2000;color:#fff;
}
#kniffelShow{background:rgba(0,0,0,0.85);}
#winnerOverlay{
  background:rgba(0,0,0,0.9);
}
#warnOverlay{
  background:rgba(255,200,0,0.1);
  backdrop-filter:blur(2px);
  color:#ffb400;font-weight:bold;font-size:22px;
  text-shadow:0 0 8px #000;
}
@keyframes fadeWarn{0%{opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.bonusActive{animation:bonusBlink 1s ease-in-out 3;}
@keyframes bonusBlink{0%,100%{background:#181818;}50%{background:#4d3a00;}}
#kniffelText{
  font-size:80px;font-weight:bold;color:#ff0;
  text-shadow:0 0 25px #f00,0 0 50px #ff0;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}
.spark{
  position:absolute;border-radius:50%;opacity:0.9;
  width:6px;height:6px;background:orange;box-shadow:0 0 10px yellow;
  animation:explode 1.2s ease-out forwards;
}
@keyframes explode{0%{transform:scale(0);opacity:1;}100%{transform:scale(1);opacity:0;}}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.burstParticle{position:absolute;pointer-events:none;animation:fireworkBurst 1.3s cubic-bezier(.12,.45,.5,1) forwards;z-index:1}
#kniffelText{position:relative;z-index:2;max-width:95vw;overflow-wrap:anywhere}
#kniffelShow.megaShow{background:radial-gradient(circle,rgba(88,19,9,.9),rgba(0,0,0,.96) 70%)}
#kniffelShow.megaShow #kniffelText{font-size:clamp(32px,9vw,74px);color:#ffe66b;text-shadow:0 0 14px #ff2c00,0 0 36px #ff4a00,0 0 70px #ffc400}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@media(max-width:420px){table{font-size:0.9em;}input.nameInput{font-size:0.95em;}}

.modebar{display:flex;justify-content:center;gap:8px;margin:8px auto;flex-wrap:wrap}
.modebar button.selected{background:#ffb400;color:#111;font-weight:bold;border-color:#ffb400}
#storageBar{margin:8px auto;font-size:12px;color:#aaa;max-width:96%}
#storageBar button{font-size:13px;padding:6px 9px}
#storageStatus{color:#8de3a0;display:block;margin:3px}
#contextMenu{box-sizing:border-box;overscroll-behavior:contain}
#contextMenu button{margin:0;border-bottom:1px solid #333;min-height:39px}
.activePlayer .turnCounter{color:#064d19;font-weight:bold;font-size:13px}
.score-top td.section-title{background:#1c3038!important}
.score-bottom td.section-title{background:#29251b!important}
tr td.filled{background:#3b3b30!important;color:#ffeb70!important}
#bonusInfo{font-size:12px;color:#ffce67;margin:4px}
@media(max-width:420px){#contextMenu{max-width:220px}}

/* v42: Smartphone-Hochformat. Kompakte Wertungs- und Summenzeilen,
   ohne die große Tablet-/Desktopansicht zu verändern. */
@media (max-width:650px) {
  #scoreTable {width:99%;font-size:12px;}
  #scoreTable th,#scoreTable td {height:24px;padding:1px 2px;line-height:1.08;}
  #scoreTable .sumRow td {height:25px;font-size:12px;line-height:1.08;}
  #scoreTable td.section-title {padding:1px 3px;}
  #scoreTable .section-title .cat-line {gap:5px;flex-wrap:nowrap;}
  #scoreTable .section-title .cat-name {font-size:11px;line-height:1.08;}
  #scoreTable .section-title .cat-rule {font-size:9px;line-height:1.08;}
  #scoreTable .section-title .cat-dice {font-size:16px;letter-spacing:0;}
  #scoreTable .playerHead {padding:1px 0;gap:1px;}
  #scoreTable input.nameInput {font-size:12px;line-height:1.12;padding:1px 0;}
  #scoreTable .turnCounter,#scoreTable .activePlayer .turnCounter {font-size:11px;line-height:1.05;}
  #scoreTable th {padding-top:2px;padding-bottom:2px;}
  #scoreTable .sumRow .cat-name {font-size:10px;}
  #scoreTable.manyPlayers .nameInput {font-size:9px;}
  #scoreTable.manyPlayers .turnCounter {font-size:9px;}
}
@media (max-width:380px) {
  #scoreTable .section-title .cat-name {font-size:10px;}
  #scoreTable .section-title .cat-rule {font-size:8px;}
  #scoreTable .section-title .cat-dice {font-size:14px;}
  #scoreTable th:first-child,#scoreTable td.section-title,
  #scoreTable.manyPlayers th:first-child,#scoreTable.manyPlayers td.section-title {width:38%;}
}

/* v43: durchgehende, deutlich unterscheidbare Zebrastreifen.
   Die Farbe gilt über die gesamte Zeile einschließlich Kategoriespalte. */
#scoreTable tbody tr:not(.sumRow):nth-child(odd) td {
  background-color: #252b2e !important;
}
#scoreTable tbody tr:not(.sumRow):nth-child(even) td {
  background-color: #121416 !important;
}
#scoreTable tbody tr.score-top:not(.sumRow):nth-child(odd) td.section-title {
  background-color: #29414b !important;
}
#scoreTable tbody tr.score-top:not(.sumRow):nth-child(even) td.section-title {
  background-color: #172a32 !important;
}
#scoreTable tbody tr.score-bottom:not(.sumRow):nth-child(odd) td.section-title {
  background-color: #3b3527 !important;
}
#scoreTable tbody tr.score-bottom:not(.sumRow):nth-child(even) td.section-title {
  background-color: #27231b !important;
}
/* Eingetragene Punkte müssen auch auf den hellen Zeilen auffallen. */
#scoreTable tbody tr td.filled {
  background-color: #484635 !important;
  color: #ffeb70 !important;
}
#scoreTable tbody tr td.active:not(.filled) {
  background-color: #3c3a1c !important;
}


/* v44: kräftigere Hell-Dunkel-Unterschiede über ALLE Wertungszeilen. */
#scoreTable tbody tr:not(.sumRow):nth-child(odd) td {
  background-color:#353b40 !important;
}
#scoreTable tbody tr:not(.sumRow):nth-child(even) td {
  background-color:#101113 !important;
}
#scoreTable tbody tr.score-top:not(.sumRow):nth-child(odd) td.section-title {
  background-color:#365765 !important;
}
#scoreTable tbody tr.score-top:not(.sumRow):nth-child(even) td.section-title {
  background-color:#142831 !important;
}
#scoreTable tbody tr.score-bottom:not(.sumRow):nth-child(odd) td.section-title {
  background-color:#524939 !important;
}
#scoreTable tbody tr.score-bottom:not(.sumRow):nth-child(even) td.section-title {
  background-color:#221e18 !important;
}
/* Gelb getönte gesamte aktive Spielerspalte mit durchgehendem Rand.
   Zebra-Wechsel bleibt darunter erkennbar. */
#scoreTable tbody tr:not(.sumRow):nth-child(odd) td.currentPlayerColumn {
  background-color:#55503a !important;
}
#scoreTable tbody tr:not(.sumRow):nth-child(even) td.currentPlayerColumn {
  background-color:#292719 !important;
}
#scoreTable tbody tr td.currentPlayerColumn.filled {
  background-color:#60572c !important;
  color:#fff185 !important;
}
#scoreTable tbody tr.sumRow td.currentPlayerColumn {
  background-color:#3b3521 !important;
}
#scoreTable tbody td.currentPlayerColumn {
  box-shadow:inset 3px 0 0 #ffb400,inset -3px 0 0 #ffb400;
}
#scoreTable tbody tr:last-child td.currentPlayerColumn {
  box-shadow:inset 3px 0 0 #ffb400,inset -3px 0 0 #ffb400,inset 0 -3px 0 #ffb400;
}
#scoreTable thead th.activePlayer {
  box-shadow:inset 3px 0 0 #ffb400,inset -3px 0 0 #ffb400,inset 0 3px 0 #ffb400;
}


/* v45: Kategoriespalte als primärer, großer Eingabebereich */
#scoreTable tbody td.categoryTapTarget {cursor:pointer;touch-action:manipulation;}
#scoreTable tbody td.categoryTapTarget:active {filter:brightness(1.45);}
#scoreTable tbody td.categoryTapTarget:focus-visible {outline:2px solid #ffb400;outline-offset:-2px;}

/* v46: Drag-Griff liegt im vorhandenen Kopf, ohne die Tabelle zu vergrößern. */
#scoreTable thead th:not(:first-child){position:relative;}
#scoreTable .playerDragGrip{position:absolute;right:0;top:0;z-index:5;width:17px;height:18px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:#b5b5b5;background:#222b;border-radius:0 0 0 4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
#scoreTable .playerDragGrip.dragging{cursor:grabbing;background:#ffb400;color:#111;}
#scoreTable thead th.dragDestination{outline:2px dashed #ffb400;outline-offset:-3px;}
#scoreTable .playerDragGrip:focus-visible{outline:2px solid #ffb400;}
@media(max-width:650px){#scoreTable .playerDragGrip{width:13px;height:14px;font-size:11px;}}

/* v47: Highscores als echtes, sofort sichtbares Dialogfenster statt unter der Tabelle */
#highscores{position:fixed;inset:0;z-index:4100;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:12px;box-sizing:border-box;}
#highscores .highscorePanel{position:relative;box-sizing:border-box;width:min(460px,100%);max-height:88dvh;overflow-y:auto;background:#20252b;border:2px solid #e0ae36;border-radius:12px;padding:15px 12px 12px;box-shadow:0 0 35px #000;text-align:center;}
#highscores h3{margin:4px 34px 6px;color:#ffda74;}
#highscoreMode{font-weight:bold;color:#ddd;margin-bottom:10px;}
#highscoreList{max-height:58dvh;overflow-y:auto;text-align:left;}
#highscoreList>div{padding:8px 6px;border-bottom:1px solid #4a4a4a;overflow-wrap:anywhere;}
#highscores .highscoreClose{position:absolute;right:5px;top:5px;padding:4px 10px;min-width:34px;}

/* v48: Kreuzmarkierung nur bei offener Punkteauswahl, ohne Layoutänderung */
#scoreTable tr.entryCrossRow > td {background:#14565d!important; color:#fff!important;}
#scoreTable td.entryCrossColumn {background:#46502b!important;color:#fff!important;}
#scoreTable tr.entryCrossRow > td.entryCrossColumn {background:#b78b19!important;color:#101010!important;box-shadow:inset 0 0 0 3px #ffe15b,0 0 0 1px #ffe15b!important;font-weight:900;}
#scoreTable tr.entryCrossRow > td.section-title {box-shadow:inset 4px 0 #6cf1e7!important;}
#scoreTable th.entryCrossHeader {box-shadow:inset 0 -3px #ffe15b!important;}

/* v50: Zweifach vergrößerte Rubrik direkt im geöffneten Auswahlfenster.
   Kein Einfluss auf die Tabellenhöhe; der Kopf bleibt beim Scrollen sichtbar. */
#contextMenu .categoryZoomLabel{
 position:sticky;top:0;z-index:2;box-sizing:border-box;
 display:flex;flex-direction:column;align-items:center;gap:3px;
 padding:10px 6px 9px;background:#173f46;border-bottom:2px solid #6cf1e7;
 color:#fff;text-align:center;overflow-wrap:anywhere;
}
#contextMenu .categoryZoomLabel strong{font-size:clamp(24px,6.5vw,36px);line-height:1.1;font-weight:900;}
#contextMenu .categoryZoomLabel span{font-size:13px;color:#d4f6ef;font-weight:700;}

/* v52: Kategorie zusätzlich links auf ca. doppelte Schriftgröße zoomen.
   Absolutes Overlay über Nachbarzeilen: keine Änderung der Tabellenmaße. */
#scoreTable tr.entryCrossRow > td.entryZoomCategory{position:relative;z-index:110;overflow:visible!important;}
#scoreTable tr.entryCrossRow > td.entryZoomCategory::after{
 content:attr(data-zoom-label);position:absolute;left:0;top:50%;transform:translateY(-50%);
 box-sizing:border-box;width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;
 padding:8px 5px;background:#07535c;border:2px solid #76fff1;border-left:5px solid #76fff1;
 border-radius:0 9px 9px 0;box-shadow:0 5px 18px #000c;
 color:white;font-size:clamp(20px,5.5vw,28px);font-weight:900;line-height:1.08;
 text-align:center;overflow-wrap:anywhere;pointer-events:none;
}

/* v54: Eigene farbige Narrenkappe mit Glöckchen und übergroße Krone.
   Absolut positioniert: keine zusätzliche Tabellenhöhe, keine neuen Zeilen. */
#scoreTable .playerHead{position:relative;overflow:visible;}
#scoreTable .liveRankIcon{position:absolute;right:0;top:-10px;z-index:12;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;filter:drop-shadow(0 2px 2px #000);}
#scoreTable .liveRankIcon.rank-crown{font-size:31px;right:-2px;top:-19px;filter:drop-shadow(0 0 5px #ffdc44) drop-shadow(0 2px 2px #000);}
#scoreTable .liveRankIcon.rank-jester{width:45px;height:41px;right:-7px;top:-25px;filter:drop-shadow(0 0 5px #ff38b4) drop-shadow(0 2px 2px #000);transform:rotate(-10deg);}
#scoreTable .liveRankIcon.rank-jester svg{width:100%;height:100%;overflow:visible;}
@media(max-width:650px){#scoreTable .liveRankIcon.rank-crown{font-size:27px;top:-18px}#scoreTable .liveRankIcon.rank-jester{width:39px;height:36px;top:-23px}}

/* v55: kompakter Kopf, ohne Eingriff in die Tabelle oder Spielmechanik */
#appTop{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px 8px;padding:3px 6px 5px;box-sizing:border-box;position:relative;z-index:15}
#appTop .appIdentity{display:flex;align-items:center;gap:6px;white-space:nowrap}
#appTop h2{font-size:clamp(14px,1.6vw,19px);line-height:1.1;margin:0}
#appTop #gameInfo{margin:0;font-size:11px}
#appTop .modebar{margin:0;gap:3px;flex-wrap:nowrap}
#appTop #controls{margin:0;padding:0;border:0;gap:3px;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;min-width:0}
#appTop button{margin:0;padding:5px 8px;font-size:12px;line-height:1.2;min-height:29px;white-space:nowrap}
#appTop #playerCountLabel{font-size:12px;white-space:nowrap;padding:0 2px}
#appTop #storageBar{flex-basis:100%;margin:0;max-width:none;line-height:1.1;min-height:13px}
#appTop #storageStatus{margin:0;font-size:10px;line-height:1.1}
#moreActions{position:relative;flex-shrink:0}
#moreActions summary{display:flex;align-items:center;justify-content:center;list-style:none;cursor:pointer;user-select:none;border:1px solid #555;background:#222;border-radius:6px;padding:5px 8px;min-height:29px;box-sizing:border-box;font-size:12px;white-space:nowrap}
#moreActions summary::-webkit-details-marker{display:none}
#moreActions[open] summary{background:#3b3322;border-color:#ffb400}
#moreActions .moreActionsPanel{position:absolute;right:0;top:calc(100% + 4px);min-width:170px;display:flex;flex-direction:column;gap:4px;background:#191919;border:1px solid #777;border-radius:8px;padding:7px;box-shadow:0 5px 18px #000;z-index:2500}
#moreActions .moreActionsPanel button{text-align:left;min-height:36px}
@media(min-width:1100px){#appTop{flex-wrap:nowrap}#appTop #storageBar{flex-basis:auto}#appTop #storageStatus{font-size:9px}}
@media(max-width:650px){
 #appTop{gap:2px 3px;padding:2px 2px 3px}
 #appTop .appIdentity{display:none}
 #appTop .modebar{flex:0 0 auto}
 #appTop .modebar button{font-size:11px;padding:4px 5px;min-height:27px}
 #appTop #controls{flex:1 1 auto;justify-content:center;gap:2px}
 #appTop #controls button{font-size:11px;padding:4px 5px;min-height:27px}
 #appTop #playerCountLabel{font-size:10px;padding:0 1px}
 #appTop #storageBar{min-height:11px}
 #appTop #storageStatus{font-size:9px}
 #moreActions summary{font-size:11px;padding:4px 5px;min-height:27px}
}
@media(max-width:430px){
 #appTop .modebar{width:100%;justify-content:center}
 #appTop #controls{width:100%;flex:0 0 100%;justify-content:center}
 #appTop #controls button{font-size:11px;padding:4px 6px}
 #appTop #controls button:nth-of-type(7){font-size:0;padding:4px 6px}
 #appTop #controls button:nth-of-type(7)::after{content:'🏆';font-size:14px}
}
/* v57: Spielername und kompletter Tabellenkopf sind Griffbereich, ohne Höhenänderung. */
#scoreTable thead th:not(:first-child){cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
#scoreTable thead th:not(:first-child).dragging{cursor:grabbing;}
#scoreTable thead th .nameInput{user-select:text;-webkit-user-select:text;}
#scoreTable .playerDragGrip{pointer-events:none;}

/* v58: sichtbare mitbewegte komplette Spalte, keine zusätzliche Tabellenhöhe */
#scoreTable thead th:not(:first-child){touch-action:none;cursor:grab;}
#scoreTable .playerDragGrip{left:0;right:0;top:0;width:100%;height:100%;opacity:.16;justify-content:flex-start;padding-left:3px;box-sizing:border-box;pointer-events:none;}
#scoreTable .columnDragSource{filter:brightness(1.35);box-shadow:inset 0 0 0 2px #70f5f0!important;}

function setStorageStatus(shortText,detail,isError=false){const el=document.getElementById('storageStatus');el.textContent=shortText;el.title=detail;el.classList.toggle('storageError',isError);}

 try{

function buildTable(){
 headerRow.replaceChildren();const first=document.createElement('th');first.textContent='Kategorie';headerRow.appendChild(first);
 for(let i=0;i<state.playerCount;i++){
  const th=document.createElement('th'),wrap=document.createElement('div');wrap.className='playerHead';

  const ctr=document.createElement('div');ctr.className='turnCounter';const rankIcon=document.createElement('span');rankIcon.className='liveRankIcon';rankIcon.setAttribute('aria-hidden','true');wrap.append(inp,ctr,rankIcon);th.appendChild(wrap);
  // Schmale Drag-Fläche als Überlagerung: keine zusätzliche Zeilenhöhe.

// Drag-and-drop: vollständige Spielerobjekte samt Punkten/Bonus bewegen.
// Der aktive Spieler wird über seine Identität, nicht über den alten Index, beibehalten.
function movePlayer(from,to){
 if(from===to||from<0||to<0||from>=state.playerCount||to>=state.playerCount)return;
 const p=state.players[from];
 if(state.players.some(q=>Object.keys(q.values).length>0||q.extra>0)&&!confirm('Spielerspalte von '+getName(from)+' wirklich verschieben? Alle Punkte und Boni wandern mit.'))return;

}
function beginPlayerDrag(e,from,head){

  const bounds=originals.map(el=>el.getBoundingClientRect());
  const width=bounds[0].width;

  ghost.style.width=width+'px';ghost.style.left=bounds[0].left+'px';ghost.style.top=bounds[0].top+'px';
  const table=document.createElement('table');table.className='dragGhostTable';
  for(let j=0;j<originals.length;j++){
   const tr=document.createElement('tr'),td=document.createElement('td');
   td.style.height=bounds[j].height+'px';td.style.width=width+'px';
   td.textContent=originals[j].querySelector('.nameInput')?.value||originals[j].innerText||'';
   if(j===0)td.className='ghostHead';

  }

 };

  const heads=[...headerRow.children].slice(1);

  heads.forEach((el,j)=>{const r=el.getBoundingClientRect();const d=Math.abs(x-(r.left+r.right)/2);if(d<dist){dist=d;best=j}});

 };

function liveRankings(){
 const scores=state.players.map(p=>sumFor(p).total);
 const hasEntries=state.players.some(p=>Object.keys(p.values).length>0||p.extra>0);
 if(!hasEntries||state.playerCount<2)return scores.map(()=> '');
 const unique=[...new Set(scores)].sort((a,b)=>b-a);
 return scores.map(score=>{const rank=unique.indexOf(score)+1;
  // Der letzte Platz hat Vorrang vor Silber/Bronze – auch bei zwei Spielern.
  // Bei komplettem Gleichstand gibt es noch keinen eindeutigen Verlierer.
  if(unique.length>1&&score===unique[unique.length-1])return 'jester';
  if(rank===1)return 'crown';if(rank===2)return 'silver';if(rank===3)return 'bronze';
  return '·'+rank;
 });
}

 if(!currentCell)return;
 const {id,i}=currentCell,player=state.players[i],old=player.values[id];

 }

 }

 if(!confirmEdit(id,i))return;

 if(bonusCategory&&v>base){

}

let fireworkTimers=[];
function clearFireworkTimers(){for(const t of fireworkTimers)clearTimeout(t);fireworkTimers=[];}
function burst(parent,x,y,count,mega){
 const palette=mega?['#ffef71','#ffb300','#ff3b25','#ff68dd','#70e7ff','#9dff67']:['#ffcc00','#ff6b00','#faff57','#ff4757'];
 for(let j=0;j<count;j++){
  const particle=document.createElement('div');particle.className='spark burstParticle';
  const angle=Math.PI*2*j/count+(Math.random()-.5)*.22;
  const radius=(mega?85:45)+Math.random()*(mega?175:95);
  particle.style.left=x+'%';particle.style.top=y+'%';
  particle.style.width=(mega?5+Math.random()*7:4+Math.random()*4)+'px';
  particle.style.height=particle.style.width;
  particle.style.background=palette[Math.floor(Math.random()*palette.length)];
  particle.style.boxShadow='0 0 '+(mega?18:9)+'px currentColor';
  particle.style.color=particle.style.background;
  particle.style.setProperty('--dx',Math.cos(angle)*radius+'px');
  particle.style.setProperty('--dy',Math.sin(angle)*radius+'px');
  particle.style.animationDuration=(mega?1.1+Math.random()*.9:.9+Math.random()*.5)+'s';
  parent.appendChild(particle);
  fireworkTimers.push(setTimeout(()=>particle.remove(),2200));
 }
}
